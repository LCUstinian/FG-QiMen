# FG-QiMen CI — runs on every push and PR. Goals:
#   1. Fail fast on broken builds / vet issues / test regressions
#      before code lands.
#   2. Pin the Go toolchain so build flags / runtime behavior is
#      reproducible across runner images.
#   3. Cross-build the 5 release targets the justfile builds to
#      catch platform-specific compile errors.
#   4. Run the unit tests with -race where the toolchain supports
#      it (the Windows runner has a known race-detector DLL issue;
#      see cmd/scan.go for the workaround).
#
# The workflow does NOT push releases — that's release.yml's job
# (tag-triggered). The CI workflow is the green-or-red gate.
#
# FG-QiMen CI — 每次 push 和 PR 触发。目标：
#   1. 构建 / vet / 测试回归在落地前快速失败。
#   2. 锁定 Go 工具链以保证跨 runner 镜像的复现性。
#   3. 跨编 justfile 编译的 5 个 release 目标以捕获平台相关
#      编译错误。
#   4. 在工具链支持时用 -race 跑单测（Windows runner 的 race
#      detector DLL 有已知问题，详见 cmd/scan.go 的 workaround）。
#
# 工作流不推送 release——那是 release.yml（tag 触发）的事。本 CI
# 工作流是绿/红门。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch / PR.
# 同一分支 / PR 上取消正在进行的 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # golangci-lint static analysis. Runs first to fail fast on style /
  # security / complexity issues that go vet doesn't catch.
  #
  # golangci-lint 静态分析。优先跑以快速失败 go vet 不抓的风格 / 安全 /
  # 复杂度问题。
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true

      - name: Run golangci-lint
        # Bypass the golangci/golangci-lint-action wrapper and
        # run golangci-lint directly. The action's binary-download
        # step was producing an opaque 'golangci-lint exit with
        # code 3' annotation that didn't surface the actual cause
        # (likely a download or PATH issue specific to v1.64.x on
        # the Ubuntu runner). A direct `go install` + `run` shows
        # the full lint output in the step log so failures are
        # debuggable.
        #
        # / 绕过 golangci/golangci-lint-action 包装器直接跑
        # golangci-lint。该 action 的二进制下载步骤产生了模糊的
        # 'golangci-lint exit with code 3' annotation，看不到真实
        # 原因（可能是 v1.64.x 在 Ubuntu runner 上的下载或 PATH
        # 问题）。直接 `go install` + `run` 在 step log 里展示完
        # 整 lint 输出，便于调试失败。
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          ~/go/bin/golangci-lint run --timeout 5m

  # HARD-rule enforcement: forbid ssh.NewSession / os/exec inside
  # credential code paths. A.2 of the audit roadmap. Cheap
  # (~1s); runs before the test matrix so a violation fails
  # the whole PR in <30s. / HARD 规则强制：禁 ssh.NewSession
  # / os/exec 在 credential 代码路径。审计路线图 A.2。
  hard-rule:
    name: HARD rule lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HARD rule lint
        run: bash scripts/lint-hard-rule.sh

  # Static analysis + unit tests. Fast, runs first.
  # 静态分析 + 单测。快速，优先跑。
  test:
    name: vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to exact 1.26.0 to remove cross-patch non-determinism.
          # `'1.26'` resolves to "latest 1.26.x" which can change
          # between CI runs and produce different go.mod / go.sum
          # hashes. The v0.2 audit F-10 already flagged 1.26 as
          # pre-release; pinning the patch makes the toolchain
          # reproducible. Bump this in lockstep with local dev.
          #
          # 锁 1.26.0 消除 patch 级别的不可重现性。`'1.26'` 会解析
          # 为"最新 1.26.x"，不同次跑可能不同，会产出不同的 go.mod
          # / go.sum 哈希。v0.2 审计 F-10 已标记 1.26 为预发布；
          # 锁 patch 让工具链可重现。跟本地开发同步升级。
          go-version: '1.26.8'
          cache: true

      - name: Show Go version
        run: go version

      - name: go mod download
        run: go mod download

      # Verify go.mod / go.sum are tidy. Catches accidental
      # indirect-dep additions that aren't committed.
      #
      # 验证 go.mod / go.sum 是 tidy 的。抓住未提交的间接依赖。
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      # The Windows runner has a known race-detector DLL issue
      # (STATUS_ENTRYPOINT_NOT_FOUND 0xc0000139). On Windows we
      # skip -race and rely on the static analyzer (go vet) plus
      # the per-package test suite.
      #
      # Windows runner 有 race-detector DLL 已知问题
      # （STATUS_ENTRYPOINT_NOT_FOUND 0xc0000139）。在 Windows 上
      # 跳过 -race，靠静态分析（go vet）+ 单测把关。
      - name: go test
        # Note: -race is disabled across all OSes (not just Windows).
        # Many tests are auth-probe tests that perform real socket
        # I/O and rely on timing assumptions that the race detector
        # perturbs enough to flake on a shared CI runner. The v0.2
        # audit P0 race coverage is provided by TestSystemPingProbe_
        # ConcurrentNoRace + targeted goroutine tests, not the global
        # `-race` flag. The Windows runner additionally has a known
        # race-detector DLL issue (STATUS_ENTRYPOINT_NOT_FOUND
        # 0xc0000139) so the project already special-cased it.
        # / 注：所有 OS 都关 -race（不只 Windows）。很多测试是
        # auth-probe，需要真实 socket I/O 并依赖时序假设，race
        # 检测器会扰动得够多以至于在共享 CI runner 上 flake。v0.2
        # 审计 P0 的 race 覆盖由 TestSystemPingProbe_Concurrent
        # NoRace + 定向 goroutine 测试提供，不是全局 -race。Windows
        # runner 还有一个已知的 race-detector DLL 问题
        # （STATUS_ENTRYPOINT_NOT_FOUND 0xc0000139），所以项目本来
        # 就特殊处理了。
        run: go test -timeout 240s ./...

      # Coverage on Linux only. The other OSes just run the suite
      # without -coverprofile to keep their wall-clock low. The
      # coverage.out artifact is uploaded for codecov + manual
      # inspection. / 仅 Linux 跑 coverage。其他 OS 跑无 coverprofile
      # 的快速版本。coverage.out artifact 上传给 codecov + 手工
      # 检查。
      - name: coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -timeout 240s -coverprofile=coverage.out -covermode=atomic ./...
          # Delegate to a Python script instead of inlining
          # bash + awk + sed. The previous inlined version
          # intermittently exit-127'd on the GHA runner
          # (suspected: default PATH mismatch + tail -1 SIGPIPE
          # race on small coverage.out files). Python 3 is
          # pre-installed on every ubuntu-latest image, so this
          # trades a bit of indirection for a deterministic
          # exit code. / 委托给 Python 脚本而不是内联 bash +
          # awk + sed。旧版本在 GHA runner 上间歇性 exit 127
          # （疑：默认 PATH 不匹配 + 小 coverage.out 文件下
          # tail -1 的 SIGPIPE 竞态）。ubuntu-latest 镜像预装
          # Python 3，所以这点间接换来了确定性退出码。
          python3 scripts/ci-coverage-check.py

      - name: upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 14

  # govulncheck: scan for known-vulnerable Go module versions. Uses
  # the Go vuln database (https://vuln.go.dev/). Fails on any call
  # graph entry that depends on a vulnerable version. / 扫描已知
  # 漏洞 Go 模块版本。用 Go vuln 数据库。任何依赖脆弱版本的调用
  # 图入口都会失败。
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Cross-compile the 5 release targets that justfile's `all`
  # recipe builds. Catches "works on my machine" platform
  # regressions before they reach a release tag.
  #
  # 跨编 justfile `all` recipe 编译的 5 个 release 目标。在它们
  # 跑到 release tag 之前先抓"在我机器上能跑"的平台回归。
  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true

      # Pin microarch level for reproducible cross-builds (audit
      # F-08). -trimpath strips source paths; -buildvcs=false
      # avoids embedding git state that varies per commit.
      #
      # 锁 microarch level 复现跨编译（审计 F-08）。-trimpath 剥
      # 源路径；-buildvcs=false 避免嵌入随 commit 变化的 git 状态。
      - name: build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: v1
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -X github.com/LCUstinian/FG-QiMen/internal/version.Value=v0.2.0" \
            -o "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}" \
            .

      - name: verify binary
        run: |
          file "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}" || true
          ls -la "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}"
