# FG-QiMen release workflow — tag-triggered multi-platform release.
# FG-QiMen release 工作流——tag 触发，多平台 release。
#
# Builds 11 platform targets (Linux x5, macOS x2, Windows x2, BSD x2),
# generates SHA256SUMS, signs artifacts with cosign (keyless, OIDC),
# generates CycloneDX SBOM, attaches SLSA Build Level 2 provenance,
# and publishes a GitHub Release with the artifacts.
#
# CI workflow (ci.yml) is the green-or-red gate; release.yml only
# runs on version tags (`v*`). workflow_dispatch is also supported
# for dry-runs.
#
# 编译 11 个平台目标（Linux x5、macOS x2、Windows x2、BSD x2），
# 生成 SHA256SUMS，用 cosign 签名（keyless、OIDC），生成
# CycloneDX SBOM，附 SLSA Build Level 2 provenance，并发布
# GitHub Release。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create GitHub Release
  id-token: write   # cosign keyless signing via OIDC
  attestations: write # sigstore provenance attestation

env:
  # Reproducible-build: pin SOURCE_DATE_EPOCH so the build output is
  # byte-identical across CI runs (modulo go version + host arch).
  # / 可复现构建：固定 SOURCE_DATE_EPOCH 使输出跨 CI 运行字节相
  # 同（除了 go 版本和 host arch）。
  SOURCE_DATE_EPOCH: '1700000000'  # 2023-11-14T22:13:20Z (stable)

jobs:
  # ---- Build, sign, and publish artifacts -----------------------------
  # 11-platform matrix. Linux non-amd64/arm64 targets use QEMU
  # emulation on ubuntu-latest. / 11 平台矩阵。Linux 非 amd64/arm64
  # 目标在 ubuntu-latest 上用 QEMU 模拟。
  release:
    name: build + sign (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native Ubuntu runner
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
            runner: ubuntu-latest
            qemu: false
          # Linux ARM64 — QEMU on Ubuntu runner
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
            runner: ubuntu-latest
            qemu: true
          # Linux ARMv7 (Raspberry Pi class) — QEMU
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            ext: ''
            runner: ubuntu-latest
            qemu: true
          # Linux i386 — QEMU
          - target: linux-386
            goos: linux
            goarch: '386'
            ext: ''
            runner: ubuntu-latest
            qemu: true
          # Linux RISC-V64 — QEMU
          - target: linux-riscv64
            goos: linux
            goarch: riscv64
            ext: ''
            runner: ubuntu-latest
            qemu: true
          # macOS Intel
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
            runner: macos-14
            qemu: false
          # macOS Apple Silicon
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
            runner: macos-14
            qemu: false
          # Windows x86_64
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
            runner: windows-latest
            qemu: false
          # Windows ARM64 (Surface Pro X class)
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: '.exe'
            runner: windows-latest
            qemu: false
          # FreeBSD amd64 — QEMU on Ubuntu (experimental).
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ''
            runner: ubuntu-latest
            qemu: true
          # OpenBSD amd64 — QEMU on Ubuntu (experimental).
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ''
            runner: ubuntu-latest
            qemu: true
    steps:
      - uses: actions/checkout@v4

      - name: derive version
        id: ver
        # Force bash on Windows runners too — the default Windows
        # shell is PowerShell, which doesn't understand the
        # `[[ ]]` and `${var#prefix}` bash idioms below.
        # / 在 Windows runner 上也强制 bash——Windows 默认 shell
        # 是 PowerShell，不识别下面的 `[[ ]]` 和 `${var#prefix}`
        # bash 惯用法。
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: build ${{ matrix.target }}
        # Force bash on Windows (mkdir -p, the ${var} ldflags
        # expansion, and the heredoc-style multi-line run all
        # require bash; PowerShell would need different syntax).
        # / 在 Windows 上强制 bash（mkdir -p、${var} ldflags 展开
        # 和多行 run 都需要 bash；PowerShell 语法不同）。
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: v1
          CGO_ENABLED: '0'
          GOARM: ${{ matrix.goarm || '' }}
          # Reproducible build: SOURCE_DATE_EPOCH is already set in
          # env at the top of this file. / 可复现构建：SOURCE_DATE_EPOCH
          # 已在文件顶部的 env 设好。
        run: |
          mkdir -p release
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -X github.com/LCUstinian/FG-QiMen/internal/version.Value=v${{ steps.ver.outputs.version }}" \
            -o "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}" \
            .

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign binary (keyless, OIDC)
        # Force bash on Windows (multi-line `\` continuation syntax
        # is bash-specific). / 在 Windows 上强制 bash（多行 `\`
        # 续行语法是 bash 专用）。
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --output-signature "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.sig" \
            --output-certificate "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.pem" \
            "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}"

      # SLSA Build Level 2 provenance attestation. / SLSA Build
      # Level 2 provenance 证明。
      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}'
          push-to-registry: false
          # Attestation is uploaded as an artifact alongside the binary
          # (next step). / 证明与 binary 一同作为 artifact 上传。

      - name: install syft
        uses: anchore/sbom-action@v0
        with:
          syft-version: v1.51.0

      - name: generate SBOM
        # Force bash on Windows (multi-line `\` continuation).
        # / 在 Windows 上强制 bash（多行 `\` 续行）。
        shell: bash
        run: |
          syft "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}" \
            --output cyclonedx-json="release/fg-qimen-${{ matrix.target }}.sbom.json"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}
            release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.sig
            release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.pem
            release/fg-qimen-${{ matrix.target }}.sbom.json
          if-no-files-found: error

  # ---- Aggregate, smoke-test, and create the GitHub Release -------
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Smoke-test the Linux/amd64 binary before computing checksums.
      # Catches broken ldflags (wrong version) and a non-functional CLI
      # surface early. / 在算 SHA256SUMS 之前 smoke-test linux/amd64
      # binary，提早捕获 ldflags 错和不能跑的 CLI。
      - name: smoke test linux/amd64 binary
        working-directory: dist
        run: |
          set -euo pipefail
          # actions/download-artifact@v4 doesn't always preserve
          # the +x bit when the source archive is created on
          # windows-latest runners (where the original +x came
          # from `go build`'s umask-077 file mode). chmod +x is
          # idempotent and safe even when the bit is already set.
          # / actions/download-artifact@v4 不总保留 +x 位——特别
          # 是当源 archive 在 windows-latest runner 上创建时（原
          # 始 +x 来自 `go build` 的 umask-077 模式）。chmod +x
          # 是幂等的，即使位已设也安全。
          chmod +x ./fg-qimen-linux-amd64
          version_output="$(./fg-qimen-linux-amd64 version)"
          printf '%s\n' "$version_output" | head -n1 | grep -F "${GITHUB_REF_NAME}"
          ./fg-qimen-linux-amd64 --help >/dev/null

      # Fail-closed SHA256SUMS: enumerate the 11 expected binaries by
      # exact name. / Fail-closed SHA256SUMS：按精确名枚举 11 个
      # binary。
      - name: compute and verify SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          expected=(
            fg-qimen-linux-amd64
            fg-qimen-linux-arm64
            fg-qimen-linux-armv7
            fg-qimen-linux-386
            fg-qimen-linux-riscv64
            fg-qimen-darwin-amd64
            fg-qimen-darwin-arm64
            fg-qimen-windows-amd64.exe
            fg-qimen-windows-arm64.exe
            fg-qimen-freebsd-amd64
            fg-qimen-openbsd-amd64
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "${#expected[@]}"
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body: |
              ## FG-QiMen ${{ github.ref_name }}

              See [RELEASE_NOTES](https://github.com/LCUstinian/FG-QiMen/blob/main/CHANGELOG.md) for what's changed.

              ### Platforms / 平台

              11 targets across Linux (amd64, arm64, armv7, 386, riscv64), macOS (amd64, arm64), Windows (amd64, arm64), FreeBSD (amd64), OpenBSD (amd64).

              ### Verification / 校验

              ```bash
              sha256sum -c SHA256SUMS
              ```

              ### cosign keyless signature / cosign keyless 签名

              ```bash
              COSIGN_EXPERIMENTAL=1 cosign verify-blob \
                --certificate fg-qimen-linux-amd64.pem \
                --signature fg-qimen-linux-amd64.sig \
                --certificate-identity-regexp 'https://github.com/LCUstinian/FG-QiMen' \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                fg-qimen-linux-amd64
              ```

              ### SLSA Build Level 2 provenance / SLSA Build Level 2 provenance

              Each `.intoto.jsonl` attestation is a SLSA Build L2 in-toto envelope.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}