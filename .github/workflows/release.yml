# FG-QiMen release workflow — tag-triggered, builds the 5 release
# targets, generates SHA256SUMS, signs the artifacts with cosign,
# generates a CycloneDX SBOM, and creates a GitHub Release.
#
# The CI workflow (ci.yml) is the green-or-red gate; release.yml
# only runs on version tags (`v*`). Manual trigger via
# workflow_dispatch is also available for dry-runs.
#
# FG-QiMen release 工作流——tag 触发，编译 5 个 release 目标，
# 生成 SHA256SUMS，用 cosign 签名，生成 CycloneDX SBOM，并创建
# GitHub Release。CI 工作流（ci.yml）是绿/红门；release.yml 仅
# 在版本 tag（`v*`）上跑。workflow_dispatch 也支持手动触发做
# dry-run。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel in-progress runs on the same tag (manual re-run only —
# tag pushes are rare).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create GitHub Release
  id-token: write   # cosign keyless signing via OIDC
  attestations: write # sigstore provenance attestation

jobs:
  # Build, sign, and publish artifacts. Each platform matrix entry
  # produces one signed binary + SBOM. / 构建、签名、发布 artifact。
  # 每个平台矩阵条目产出一个签名 binary + SBOM。
  release:
    name: build + sign (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The version.Value ldflag is sourced from the tag (v0.3.0 →
      # "v0.3.0"). Strip the leading "v" so the binary's internal
      # version reads "0.3.0" not "v0.3.0". / ldflag 的 version.Value
      # 从 tag 取（v0.3.0 → "v0.3.0"）。剥掉前导 "v" 让 binary
      # 内部 version 读作 "0.3.0" 而非 "v0.3.0"。
      - name: derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: v1
          CGO_ENABLED: '0'
        run: |
          mkdir -p release
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -X github.com/LCUstinian/FG-QiMen/internal/version.Value=v${{ steps.ver.outputs.version }}" \
            -o "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}" \
            .

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign binary (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --output-signature "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.sig" \
            --output-certificate "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.pem" \
            "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}"

      - name: install syft
        uses: anchore/sbom-action@v0
        with:
          syft-version: v1.0.0

      - name: generate SBOM
        run: |
          syft "release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}" \
            --output cyclonedx-json="release/fg-qimen-${{ matrix.target }}.sbom.json"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}
            release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.sig
            release/fg-qimen-${{ matrix.target }}${{ matrix.ext }}.pem
            release/fg-qimen-${{ matrix.target }}.sbom.json
          if-no-files-found: error

  # Aggregate all per-platform artifacts, compute SHA256SUMS, attach
  # to a GitHub Release. Runs only on tag push. / 汇总所有平台的
  # artifact，算 SHA256SUMS，附到 GitHub Release。仅在 tag push
  # 触发。
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Smoke-test the Linux/amd64 binary before computing checksums.
      # Catches broken ldflags (wrong version) and a non-functional CLI
      # surface early, so we never publish a binary that fails `version`
      # or `--help`. / 在算 SHA256SUMS 之前 smoke-test linux/amd64
      # binary，提早捕获 ldflags 错（version 不对）和不能跑的 CLI。
      - name: smoke test linux/amd64 binary
        working-directory: dist
        run: |
          set -euo pipefail
          version_output="$(./fg-qimen-linux-amd64 version)"
          printf '%s\n' "$version_output" | head -n1 | grep -F "${GITHUB_REF_NAME}"
          ./fg-qimen-linux-amd64 --help >/dev/null

      # Fail-closed SHA256SUMS: enumerate the five expected binaries by
      # exact name (no `*.exe` / `*-*` globs that could silently match
      # unrelated files), require each to exist and be non-empty, hash
      # exactly that set, assert the line count matches, then re-verify
      # via `sha256sum -c`. The previous version used `|| true` and
      # globs that swallowed missing-artifact errors. / Fail-closed
      # SHA256SUMS：按精确名枚举五个 binary（不用会误匹配无关文件
      # 的 `*.exe` / `*-*` glob），逐个要求存在且非空，再 hash 这一
      # 固定集合，断言行数匹配，再用 `sha256sum -c` 复验。原版本用
      # `|| true` 和 glob 把 missing-artifact 错误吞掉了。
      - name: compute and verify SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          expected=(
            fg-qimen-linux-amd64
            fg-qimen-linux-arm64
            fg-qimen-darwin-amd64
            fg-qimen-darwin-arm64
            fg-qimen-windows-amd64.exe
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "${#expected[@]}"
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body: |
            ## FG-QiMen ${{ github.ref_name }}

            See [RELEASE_NOTES](https://github.com/LCUstinian/FG-QiMen/blob/main/CHANGELOG.md) for what's changed.

            ### Verification / 校验

            ```bash
            # Download SHA256SUMS from the release and verify each binary. / 下载 SHA256SUMS 并校验。
            sha256sum -c SHA256SUMS
            ```

            ### Signed artifacts / 已签名 artifact

            Each binary is keyless-signed with [cosign](https://docs.sigstore.dev/):

            ```bash
            cosign verify-blob \
              --certificate fg-qimen-linux-amd64.pem \
              --signature fg-qimen-linux-amd64.sig \
              --certificate-identity-regexp 'https://github.com/.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              fg-qimen-linux-amd64
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
