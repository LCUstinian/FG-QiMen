# golangci-lint configuration for FG-QiMen (v0.3.0+).
#
# Pragmatic minimal config — we only enable the linters that catch
# real correctness issues. Style / refactor / cosmetic linters are
# disabled (commented lists below for reference) because the
# volume of false positives (Go-version-dependent, opinion-based,
# CJK-comment interactions) drowned the CI signal. The
# /-just-write-the-code-style/ tradeoff is acceptable for v0.x.
#
# / FG-QiMen 的 golangci-lint 配置（v0.3.0+）。务实极简版——只
# 启用抓真实正确性问题的检查。风格/重构/外观类 linter 全关（下方
# 注释里列出可参考），因为 false-positive 量太大（受 Go 版本影响、
# 主观判断、和中文注释冲突）把 CI 信号淹没了。/just-write-the-code-style/
# 取舍在 v0.x 可以接受。
#
# Usage:
#   golangci-lint run ./...
#
# See: https://golangci-lint.run/

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck      # unchecked errors (skip in test files via issues.exclude-rules)
    - govet         # standard go vet
    - ineffassign   # unused assignments
    - staticcheck   # SA* checks
    - unused        # unused identifiers
    - gofmt         # formatting
    - gosec         # G* security (with most checks disabled)
    - errorlint     # %w vs %v on errors
    # revive is intentionally disabled: the default rule set flags
    # stutter-naming violations (OutputConfig → Config etc.) on
    # the public API that we don't want to break across v0.x.
    # The actual naming issues (exported symbols without doc
    # comments) are caught by `gofmt` / `go vet` indirectly. Re-
    # enable after the v1.0 API renames.
    # / revive 默认规则集会报 stutter-naming 问题（OutputConfig
    # → Config 等），但这是要保持 v0.x 兼容的 public API，不
    # 想打破。exported 符号缺 doc 注释的命名问题由 gofmt / go
    # vet 间接抓到。v1.0 API 重命名后再重新启用。

# Default excludes for the linters that have the most false positives.
# Each linter's enabled-checks are its full set; "all,-X" means "all
# except X" which is the new v1.7+ syntax. The old v1.61 syntax
# (disabled-checks) is also still understood by golangci-lint, but
# the v1.7+ form works across both.
linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - ifElseChain
      - singleCaseSwitch
      - hugeParam
      - unnamedResult
      - commentFormatting
      - appendCombine
      - appendAssign
      - httpNoBody
      - emptyStringTest
      - equalFold
      - stringXbytes
      - preferFprint
      - paramTypeCombine
      - rangeValCopy
      - ptrToRefParam
      - commentedOutCode
  gosec:
    excludes:
      - G104
      - G115
      - G401
      - G501
      - G505
  revive:
    # The default rule set fires on OutputConfig / ProxyType / etc.
    # (stutter). There is no clean "disable stutter" knob in v1.64
    # because the rule was renamed. Leaving the default config
    # here; if revive complains, switch to a minimal rules list
    # like the comment in the previous commit message.
    # / v1.64 里 stutter 规则名变了，没有干净的关法。先用默认配
    # 置；如果 revive 报错再改成最小 rules 列表。
    {}
  staticcheck:
    # Enable all checks then disable the ones that produce
    # false positives or are intentionally violated. / 默认全
    # 开，关掉有 false positive 或故意违反的。
    checks:
      - all
      - "-SA1019"  # allow deprecated in tests
      - "-SA9003"  # empty-branch placeholders for OS-specific code

issues:
  # Skip generated files and vendored deps. / 跳过生成文件与 vendored 依赖。
  exclude-dirs:
    - binary=release
    - release
    - .github
    - .trae
    - .claude
    - docs
  exclude-files:
    - '.*\.pb\.go$'
  # Max 50 issues per linter — anything beyond is a separate code
  # problem, not a CI failure. / 每个 linter 最多 50 条 issue——超出的
  # 是另一个代码问题，不让 CI 直接挂。
  max-issues-per-linter: 50
  max-same-issues: 10
  # Don't fail CI on the "exclude" rules. / 不让 exclude 规则失败 CI。
  exclude-rules:
    # Tests: relax errcheck (defer Close is fine unchecked in tests),
    # gosec (test data is not real), and gocritic (style).
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic
    - path: docs/
      linters:
        - misspell
  show-stats: true
